name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (unit, API, integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The embeddings live in Git LFS; caching them saves the repo's LFS bandwidth quota.
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v6
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Build the feature store
        run: python -m similarity.build
      - name: Run tests
        run: python -m pytest -q

  deploy:
    name: Docker image + Kubernetes (kind)
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE: product-similarity:1.0.0
    steps:
      - uses: actions/checkout@v7
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v6
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull

      - name: Build the image
        run: docker build -t "$IMAGE" .

      - name: Smoke-test the container (read-only root FS, no capabilities)
        run: |
          docker run -d --name api -p 8000:8000 --read-only --tmpfs /tmp --cap-drop ALL "$IMAGE"
          for _ in $(seq 60); do curl -sf localhost:8000/ready && break; sleep 1; done
          curl -sf "localhost:8000/find_similar_products?product_id=80e47075f39a4bdf6b83f2d7690c95fe&num_similar=5"
          code=$(curl -s -o /dev/null -w '%{http_code}' "localhost:8000/find_similar_products?product_id=nope&num_similar=5")
          test "$code" = 404
          docker rm -f api

      - uses: helm/kind-action@v1
        with:
          cluster_name: similarity

      - name: Deploy to kind
        run: |
          kind load docker-image "$IMAGE" --name similarity
          kubectl apply -f k8s/
          kubectl rollout status deployment/product-similarity --timeout=180s

      - name: API checks + zero-downtime rolling restart under load
        run: scripts/k8s_smoke_test.sh

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get all -o wide
          kubectl describe pods -l app=product-similarity
          kubectl logs -l app=product-similarity --tail=100
